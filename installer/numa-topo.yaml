apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: resource-exporter
  namespace: volcano-system
rules:
  - apiGroups: ["nodeinfo.volcano.sh"]
    resources: ["numatopologies"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: resource-exporter-bind
subjects:
  - kind: ServiceAccount
    name: resource-exporter-account
    namespace: volcano-system
roleRef:
  kind: ClusterRole
  name: resource-exporter
  apiGroup: rbac.authorization.k8s.io

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: resource-exporter-account
  namespace: volcano-system

---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: resource-exporter-daemonset
  namespace: volcano-system
  labels:
    app.kubernetes.io/name: resource-exporter
    app.kubernetes.io/component: numa-topology
    app.kubernetes.io/part-of: volcano
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: resource-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: resource-exporter
        app.kubernetes.io/component: numa-topology
        app.kubernetes.io/part-of: volcano
    spec:
      serviceAccountName: resource-exporter-account
      containers:
        - name: resource-topology
          image: volcanosh/numatopo:latest
          imagePullPolicy: IfNotPresent
          args:
            - --kubelet-conf=/host/kubelet/config.yaml
            - --cpu-manager-state=/host/kubelet/cpu_manager_state
            - --device-path=/host/device
            - --health-addr=:8081
            - -v=4
          ports:
            - name: health
              containerPort: 8081
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          env:
            - name: MY_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: device-path
              mountPath: "/host/device"
              readOnly: true
            - name: kubelet-path
              mountPath: "/host/kubelet"
              readOnly: true
      volumes:
        - name: device-path
          hostPath:
            path: "/sys/devices/system"
        - name: kubelet-path
          hostPath:
            path: "/var/lib/kubelet"
